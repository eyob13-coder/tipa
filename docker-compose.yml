version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: tipa_postgres
    restart: always
    environment:
      POSTGRES_USER: tipa_user
      POSTGRES_PASSWORD: tipa_password
      POSTGRES_DB: tipa_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: tipa_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - BOT_TOKEN=${BOT_TOKEN:-}
      - BOT_USERNAME=TipaPayBot
      - VERIFY_ET_API_KEY=${VERIFY_ET_API_KEY:-}
      - VERIFY_ET_BASE_URL=https://verify.et
      - CHECK_ET_API_KEY=${CHECK_ET_API_KEY:-}
      - CHECK_ET_BASE_URL=https://api.check.et/api/v1
      - JUSTVERIFY_API_KEY=${JUSTVERIFY_API_KEY:-}
      - JUSTVERIFY_BASE_URL=https://justverify.et
      - DATABASE_URL=postgresql+asyncpg://tipa_user:tipa_password@db:5432/tipa_db
      - PLATFORM_FEE_BIRR=0.0
    depends_on:
      - db

volumes:
  postgres_data:
